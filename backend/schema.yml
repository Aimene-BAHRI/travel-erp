components:
  schemas:
    Agency:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 160
        legal_name:
          type: string
          maxLength: 200
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        registration_number:
          type: string
          maxLength: 100
        tax_number:
          type: string
          maxLength: 100
        address:
          type: string
        phone:
          type: string
          maxLength: 40
        email:
          type: string
          format: email
          maxLength: 254
        website:
          type: string
          format: uri
          maxLength: 200
        logo:
          type: string
          format: uri
        is_active:
          type: boolean
          readOnly: true
        settings:
          allOf:
          - $ref: '#/components/schemas/AgencySettings'
          readOnly: true
      required:
      - id
      - is_active
      - name
      - settings
      - slug
    AgencyCurrency:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        currency:
          type: string
        currency_name:
          type: string
          readOnly: true
        currency_symbol:
          type: string
          readOnly: true
        is_enabled:
          type: boolean
        is_accounting:
          type: boolean
      required:
      - currency
      - currency_name
      - currency_symbol
      - id
    AgencySettings:
      type: object
      properties:
        timezone:
          type: string
          maxLength: 64
        default_language:
          type: string
          maxLength: 10
    Airline:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 160
        iata_code:
          type: string
          nullable: true
          maxLength: 2
        icao_code:
          type: string
          nullable: true
          maxLength: 3
        country:
          type: string
          format: uuid
          nullable: true
        country_code:
          type: string
          readOnly: true
        is_active:
          type: boolean
      required:
      - country_code
      - id
      - name
    Branch:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 160
        code:
          type: string
          maxLength: 30
        address:
          type: string
        phone:
          type: string
          maxLength: 40
        email:
          type: string
          format: email
          maxLength: 254
        is_active:
          type: boolean
      required:
      - code
      - id
      - name
    CategoryEnum:
      enum:
      - PASSPORT
      - PHOTO
      - IDENTITY
      - VISA
      - CONTRACT
      - OTHER
      type: string
      description: |-
        * `PASSPORT` - Passport
        * `PHOTO` - Photo
        * `IDENTITY` - Identity
        * `VISA` - Visa
        * `CONTRACT` - Contract
        * `OTHER` - Other
    City:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        country:
          type: string
          format: uuid
        country_code:
          type: string
          readOnly: true
        country_name:
          type: string
          readOnly: true
      required:
      - country
      - country_code
      - country_name
      - id
      - name
    Country:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        code:
          type: string
          maxLength: 2
      required:
      - code
      - id
      - name
    Csrf:
      type: object
      properties:
        csrfToken:
          type: string
      required:
      - csrfToken
    Currency:
      type: object
      properties:
        code:
          type: string
          maxLength: 3
        name:
          type: string
          maxLength: 80
        symbol:
          type: string
          maxLength: 8
        decimal_places:
          type: integer
          maximum: 32767
          minimum: 0
        is_active:
          type: boolean
      required:
      - code
      - name
    Customer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          $ref: '#/components/schemas/KindEnum'
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        company_name:
          type: string
          maxLength: 180
        display_name:
          type: string
          readOnly: true
        phone:
          type: string
          maxLength: 40
        email:
          type: string
          format: email
          maxLength: 254
        address:
          type: string
        notes:
          type: string
        branch:
          type: string
          format: uuid
        branch_name:
          type: string
          readOnly: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - branch
      - branch_name
      - created_at
      - display_name
      - id
      - updated_at
    DirectionEnum:
      enum:
      - OUTBOUND
      - RETURN
      - INTERNAL
      type: string
      description: |-
        * `OUTBOUND` - Outbound
        * `RETURN` - Return
        * `INTERNAL` - Internal
    Document:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        category:
          $ref: '#/components/schemas/CategoryEnum'
        title:
          type: string
          maxLength: 180
        original_filename:
          type: string
          maxLength: 255
        mime_type:
          type: string
          maxLength: 120
        size_bytes:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        sha256:
          type: string
          maxLength: 64
        owner_type:
          type: string
          nullable: true
          readOnly: true
        owner_id:
          type: string
          nullable: true
          readOnly: true
        download_url:
          type: string
          format: uri
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - category
      - created_at
      - download_url
      - id
      - mime_type
      - original_filename
      - owner_id
      - owner_type
      - sha256
      - size_bytes
      - title
    DocumentUpload:
      type: object
      properties:
        file:
          type: string
          format: uri
          writeOnly: true
        category:
          $ref: '#/components/schemas/CategoryEnum'
        title:
          type: string
          maxLength: 180
        owner_type:
          $ref: '#/components/schemas/OwnerTypeEnum'
        owner_id:
          type: string
          format: uuid
        purpose:
          type: string
          maxLength: 80
      required:
      - category
      - file
      - owner_id
      - owner_type
      - title
    GenderEnum:
      enum:
      - F
      - M
      - X
      type: string
      description: |-
        * `F` - Female
        * `M` - Male
        * `X` - Unspecified
    Hotel:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 180
        city:
          type: string
          format: uuid
        city_name:
          type: string
          readOnly: true
        country_code:
          type: string
          readOnly: true
        star_rating:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
        address:
          type: string
        phone:
          type: string
          maxLength: 40
        email:
          type: string
          format: email
          maxLength: 254
        website:
          type: string
          format: uri
          maxLength: 200
        check_in_time:
          type: string
          format: time
          nullable: true
        check_out_time:
          type: string
          format: time
          nullable: true
        notes:
          type: string
        is_active:
          type: boolean
        room_count:
          type: integer
          readOnly: true
          default: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - city
      - city_name
      - country_code
      - created_at
      - id
      - name
      - room_count
      - updated_at
    KindEnum:
      enum:
      - INDIVIDUAL
      - COMPANY
      type: string
      description: |-
        * `INDIVIDUAL` - Individual
        * `COMPANY` - Company
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    Me:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        agency_name:
          type: string
          readOnly: true
        branch:
          type: string
          format: uuid
          nullable: true
        branch_name:
          type: string
          readOnly: true
        role_names:
          type: array
          items:
            type: string
          readOnly: true
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        is_platform_admin:
          type: boolean
        permissions:
          type: array
