[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-erp-backend"
version = "0.1.0"
description = "Travel ERP API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.16,<3.17",
    "djangorestframework-simplejwt>=5.5,<5.6",
    "django-cors-headers>=4.7,<5",
    "django-environ>=0.12,<0.13",
    "drf-spectacular>=0.28,<0.29",
    "psycopg[binary]>=3.2,<3.3",
    "Pillow>=11,<12",
    "num2words>=0.5.14,<0.6",
    "openpyxl>=3.1,<3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-django>=4.11,<5",
    "pytest-cov>=6,<7",
    "ruff>=0.11,<0.12",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
addopts = "--strict-markers --disable-warnings --tb=short"
testpaths = ["tests", "common"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DJ"]
ignore = ["DJ001"]
